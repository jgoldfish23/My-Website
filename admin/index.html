<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>J &amp; D · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C2523; --bg-2:#071A19; --bg-3:rgba(255,255,255,.03);
    --fg:#E9EEE9; --fg-2:#8AA697; --accent:#D2A94E; --accent-soft:rgba(210,169,78,.16);
    --line:rgba(138,166,151,.24); --line-2:rgba(138,166,151,.13);
    --err:#E07CA3; --ok:#7FB98E;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif;
    font-weight:300; font-size:15.5px; line-height:1.6;}
  .wrap{max-width:780px; margin:0 auto; padding:0 20px 80px;}
  a{color:var(--accent);}

  #gate{min-height:100vh; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:18px; padding:24px;}
  #gate h1{font-weight:300; letter-spacing:.04em; margin:0; font-size:1.4rem;}
  #gate form{display:flex; gap:10px;}
  #gate input{background:var(--bg-3); border:1px solid var(--line); color:var(--fg);
    padding:10px 14px; border-radius:8px; font-size:1rem; letter-spacing:.2em;
    outline:none; width:200px; text-align:center;}
  #gate input:focus{border-color:var(--accent);}
  #gate button{background:var(--accent); color:var(--bg); border:0; border-radius:8px;
    padding:10px 18px; cursor:pointer; font-weight:500;}
  #gate .err{color:var(--err); font-size:.85rem; min-height:1.2em;}

  header.bar{padding:34px 0 10px;}
  header.bar h1{font-weight:300; font-size:26px; margin:0 0 4px; letter-spacing:-.02em;}
  header.bar p{margin:0; color:var(--fg-2); font-size:13.5px;}

  h2{font-weight:400; font-size:18px; letter-spacing:.02em; margin:40px 0 14px;
    padding-bottom:10px; border-bottom:1px solid var(--line);}
  label{display:block; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--fg-2); margin:14px 0 6px;}
  input[type=text], textarea{width:100%; background:var(--bg-3); border:1px solid var(--line);
    border-radius:10px; color:var(--fg); font-family:inherit; font-size:15px; padding:11px 13px; outline:none;}
  input:focus, textarea:focus{border-color:var(--accent);}
  textarea{min-height:80px; resize:vertical;}
  button.primary{margin-top:16px; background:var(--accent); color:var(--bg); border:none;
    border-radius:999px; font-family:inherit; font-size:14px; font-weight:500;
    padding:11px 26px; cursor:pointer;}
  button.primary:disabled{opacity:.5;}
  .status{font-size:13.5px; min-height:1.3em; margin-top:8px;}
  .status.ok{color:var(--ok);} .status.err{color:var(--err);}

  .item{display:flex; gap:12px; align-items:baseline; padding:12px 0; border-bottom:1px solid var(--line-2);}
  .item .when{color:var(--accent); font-size:11px; letter-spacing:.14em; text-transform:uppercase; flex:0 0 110px;}
  .item .body{flex:1;}
  .item .body b{font-weight:500;}
  .item .body p{margin:2px 0 0; color:var(--fg-2); font-size:14px;}
  .item button{background:transparent; border:1px solid var(--line); color:var(--fg-2);
    border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer;}
  .item button:hover{border-color:var(--err); color:var(--err);}

  .stat-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
  .stat{border:1px solid var(--line); border-radius:14px; background:var(--bg-3);
    padding:14px 20px; min-width:120px;}
  .stat .n{font-size:26px; font-weight:300; color:var(--accent);}
  .stat .l{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-2);}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-2);
    text-align:left; font-weight:500; padding:8px 10px 8px 0; border-bottom:1px solid var(--line);}
  td{padding:10px 10px 10px 0; border-bottom:1px solid var(--line-2); vertical-align:top;}
  td.yes{color:var(--ok);} td.no{color:var(--err);}
  .muted{color:var(--fg-2);}
</style>
</head>
<body>

<div id="gate">
  <h1>J &amp; D · Admin</h1>
  <form id="passForm">
    <input id="passInput" type="password" placeholder="passcode" autofocus>
    <button type="submit">Enter</button>
  </form>
  <div class="err" id="gateErr"></div>
</div>

<div class="wrap" id="app" hidden>
  <header class="bar">
    <h1>The back office</h1>
    <p>Add moments to the record, and see who's coming. <a href="/">Back to the site →</a></p>
  </header>

  <h2>Add to the record</h2>
  <p class="muted" style="font-size:13.5px; margin:0;">New entries appear on the homepage timeline, right before the wedding day.</p>
  <form id="recForm">
    <label for="rWhen">When (as it should appear — e.g. "September 2026")</label>
    <input type="text" id="rWhen" required>
    <label for="rTitle">Title</label>
    <input type="text" id="rTitle" required placeholder="e.g. The tasting trip">
    <label for="rText">The story</label>
    <textarea id="rText" required placeholder="A sentence or two."></textarea>
    <button class="primary" type="submit">Add entry</button>
    <div class="status" id="recMsg"></div>
  </form>

  <h2>Live record entries</h2>
  <div id="recList"><span class="muted">Loading…</span></div>

  <h2>RSVPs</h2>
  <div class="stat-row" id="rsvpStats"></div>
  <div id="rsvpList"><span class="muted">Loading…</span></div>
</div>

<script>
(function(){
  var PASS_KEY = 'wedding_pass';
  var pass = null;

  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({'x-wedding-pass': pass}, opts.headers || {});
    return fetch(path, opts);
  }

  function verify(p){
    return fetch('/api/wedding', { headers:{'x-wedding-pass':p} }).then(function(r){
      if (r.status === 401) return false;
      if (!r.ok) throw new Error('Server not ready (' + r.status + ')');
      return true;
    });
  }

  function boot(p){
    pass = p;
    try{ localStorage.setItem(PASS_KEY, p); }catch(e){}
    document.getElementById('gate').remove();
    document.getElementById('app').hidden = false;
    loadRecord(); loadRsvps();
  }

  var gateErr = document.getElementById('gateErr');
  document.getElementById('passForm').addEventListener('submit', function(e){
    e.preventDefault();
    var p = document.getElementById('passInput').value.trim();
    if (!p) return;
    gateErr.textContent = '';
    verify(p).then(function(ok){
      if (ok) boot(p); else gateErr.textContent = "That's not it — try again.";
    }).catch(function(ex){ gateErr.textContent = ex.message; });
  });
  try{
    var saved = localStorage.getItem(PASS_KEY);
    if (saved) verify(saved).then(function(ok){ if (ok) boot(saved); }).catch(function(){});
  }catch(e){}

  /* ----- record ----- */
  var recMsg = document.getElementById('recMsg');
  document.getElementById('recForm').addEventListener('submit', function(e){
    e.preventDefault();
    recMsg.className = 'status'; recMsg.textContent = 'Saving…';
    api('/api/record', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({
        when: document.getElementById('rWhen').value,
        title: document.getElementById('rTitle').value,
        text: document.getElementById('rText').value
      })
    }).then(function(r){
      if (!r.ok) throw new Error();
      recMsg.className = 'status ok'; recMsg.textContent = 'Added — it’s live on the homepage.';
      document.getElementById('recForm').reset();
      loadRecord();
    }).catch(function(){
      recMsg.className = 'status err'; recMsg.textContent = 'Could not save. Try again.';
    });
  });

  function loadRecord(){
    var box = document.getElementById('recList');
    fetch('/api/record').then(function(r){ return r.json(); }).then(function(items){
      box.innerHTML = '';
      if (!items.length){ box.innerHTML = '<span class="muted">Nothing added yet — the built-in timeline still shows.</span>'; return; }
      items.forEach(function(en, i){
        var row = document.createElement('div'); row.className = 'item';
        var w = document.createElement('div'); w.className = 'when'; w.textContent = en.when || '—';
        var b = document.createElement('div'); b.className = 'body';
        var t = document.createElement('b'); t.textContent = en.title;
        var p = document.createElement('p'); p.textContent = en.text;
        b.appendChild(t); b.appendChild(p);
        var del = document.createElement('button'); del.textContent = 'Remove';
        del.addEventListener('click', function(){
          if (!confirm('Remove "' + en.title + '" from the record?')) return;
          api('/api/record', { method:'DELETE',
            headers:{'content-type':'application/json'},
            body: JSON.stringify({ index:i })
          }).then(loadRecord);
        });
        row.appendChild(w); row.appendChild(b); row.appendChild(del);
        box.appendChild(row);
      });
    });
  }

  /* ----- rsvps ----- */
  function loadRsvps(){
    var box = document.getElementById('rsvpList');
    var stats = document.getElementById('rsvpStats');
    api('/api/rsvp').then(function(r){ return r.json(); }).then(function(items){
      var yes = items.filter(function(i){ return i.attending; });
      var heads = yes.reduce(function(s,i){ return s + (i.partySize || 1); }, 0);
      stats.innerHTML = '';
      [[items.length, 'replies'], [yes.length, 'parties coming'], [heads, 'people coming'], [40 - heads, 'seats left of 40']]
        .forEach(function(s){
          var d = document.createElement('div'); d.className = 'stat';
          var n = document.createElement('div'); n.className = 'n'; n.textContent = s[0];
          var l = document.createElement('div'); l.className = 'l'; l.textContent = s[1];
          d.appendChild(n); d.appendChild(l); stats.appendChild(d);
        });
      if (!items.length){ box.innerHTML = '<span class="muted">No RSVPs yet.</span>'; return; }
      var tbl = document.createElement('table');
      tbl.innerHTML = '<thead><tr><th>Name</th><th>Coming?</th><th>Party</th><th>Note</th><th>When</th></tr></thead>';
      var tb = document.createElement('tbody');
      items.forEach(function(en){
        var tr = document.createElement('tr');
        function td(txt, cls){ var c = document.createElement('td'); c.textContent = txt; if (cls) c.className = cls; return c; }
        tr.appendChild(td(en.name + (en.email ? '\n' + en.email : '')));
        tr.appendChild(td(en.attending ? 'Yes' : 'No', en.attending ? 'yes' : 'no'));
        tr.appendChild(td(en.partySize || 1));
        tr.appendChild(td(en.note || '', 'muted'));
        tr.appendChild(td(new Date(en.ts).toLocaleDateString(), 'muted'));
        tb.appendChild(tr);
      });
      tbl.appendChild(tb);
      box.innerHTML = ''; box.appendChild(tbl);
    }).catch(function(){
      box.innerHTML = '<span class="muted">Could not load RSVPs.</span>';
    });
  }
})();
</script>
</body>
</html>
