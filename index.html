<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Site</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; }
    textarea { width: 100%; height: 90px; padding: 10px; font: inherit; }
    button { padding: 10px 18px; font: inherit; margin-top: 10px; cursor: pointer; }
    #out { margin-top: 24px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>It's alive</h1>
  <textarea id="msg" placeholder="Ask something..."></textarea>
  <button onclick="send()">Send</button>
  <div id="out"></div>

  <script>
    async function send() {
      const out = document.getElementById('out');
      out.textContent = 'Thinking...';
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          messages: [{ role: 'user', content: document.getElementById('msg').value }]
        })
      });
      const data = await res.json();
      out.textContent = data.content?.[0]?.text || JSON.stringify(data);
    }
  </script>
</body>
</html>
