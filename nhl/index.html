.jsh-nav a i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.jsh-nav a:hover{color:#fff!important;background:rgba(255,255,255,.08)}
.jsh-nav a.on{color:#fff!important;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 4px 14px -4px var(--c)}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* clear of the notch and status bar (2026-10-21, Jamo: "the top tabs bar goes under the top a little"): the bar grows by the phone's safe area at the top, plus a little air on phones */
.jsh{box-sizing:border-box;height:calc(44px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}

/* phones (2026-10-21, design pass): every league fits - the page you're on keeps its name, the others show just the logo */
@media (max-width:560px){.jsh-nav{gap:1px}.jsh-nav a:not(.on){font-size:0;gap:0;padding:0 8px}.jsh-nav a:not(.on) .jsh-lg{width:20px;height:20px}.jsh-nav a.on{padding:0 11px 0 9px}}
/* phones: the hub header slides away while you scroll down and comes back as soon as you scroll up */

<script>
/* Jamo Sports Hub: light/dark and the time zone follow you between CFB, NFL and NBA (each keeps its own favourite team).
   Runs before the hub's own script, so a choice made in one hub is in place before the next one reads its settings. */
(function(){ try {
  var s = (location.pathname.indexOf('/sports/articles') === 0 ? 'articles' : (location.pathname.split('/')[1] || 'sports')).toLowerCase(), a = document.querySelector('.jsh-nav a[data-s="' + s + '"]');
  if (a) { a.className = 'on'; a.setAttribute('aria-current', 'page'); }
  if (s === 'sports' || s === 'articles') return;
  var key = s + '-settings', sh = JSON.parse(localStorage.getItem('jsh-shared') || 'null');
  if (sh) { var own = JSON.parse(localStorage.getItem(key) || '{}'), ch = false;
    ['theme', 'tz'].forEach(function (k) { if (sh[k] && own[k] !== sh[k]) { own[k] = sh[k]; ch = true; } });
    if (ch) localStorage.setItem(key, JSON.stringify(own)); }
  var save = function () { try { var o = JSON.parse(localStorage.getItem(key) || '{}'); if (o.theme || o.tz) localStorage.setItem('jsh-shared', JSON.stringify({ theme: o.theme || 'auto', tz: o.tz || 'MT' })); } catch (e) {} };
  addEventListener('pagehide', save); document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
} catch (e) {} })();
</script>
<script>
/* phones (2026-10-21): tuck the hub's sticky header (sub-tabs + scores strip) away on scroll down, bring it back on scroll up */
(function(){ var last = 0, h = null, mq = window.matchMedia('(max-width:760px)');
  function hdr(){ if (!h || !h.isConnected) h = document.querySelector('header.top'); return h; }
  function off(e){ e.classList.remove('jsh-tuck'); e.style.transform = ''; }
  addEventListener('scroll', function(){ var e = hdr(); if (!e) return; var y = window.scrollY, d = y - last; last = y;
    if (!mq.matches || y < 260 || e.contains(document.activeElement) || d < -4) { if (e.classList.contains('jsh-tuck')) off(e); return; }
    if (d > 6 && !e.classList.contains('jsh-tuck')) { var top = parseFloat(getComputedStyle(e).top) || 0; e.style.transform = 'translateY(' + (-(e.offsetHeight + top)) + 'px)'; e.classList.add('jsh-tuck'); } }, { passive: true });
  addEventListener('hashchange', function(){ var e = hdr(); if (e) off(e); });
})();
</script>

<style>
/* NHL hub (2026-10-15): scores, game pages, standings, TV guide, teams. Ice rink background (light: fresh sheet; dark: night game). */
:root{--ice1:#f3f9fd;--ice2:#dcecf7;--ice3:#c7dff0;--red:#d7263d;--blue:#1d5fc4;--crease:#8ec5f0;--line-o:.32;
  --ink:#0b1626;--ink-2:#3d4c63;--ink-3:#6b7a90;--card:rgba(255,255,255,.72);--card-2:rgba(255,255,255,.55);--line:rgba(17,40,75,.14);--line-2:rgba(17,40,75,.08);
  --accent:#0b5cad;--accent-soft:rgba(11,92,173,.12);--live:#e0193a;--gold:#b7860b;--good:#14833b;--bad:#c62828;--disp:"Inter Tight",system-ui,sans-serif;--shadow:0 10px 30px -18px rgba(10,40,80,.45)}
:root.dark{--ice1:#08111f;--ice2:#0c1a2e;--ice3:#11233d;--red:#ff4d6d;--blue:#4c8dff;--crease:#2c6fb3;--line-o:.42;
  --ink:#eef4fc;--ink-2:#b8c6da;--ink-3:#7f90a8;--card:rgba(12,24,42,.72);--card-2:rgba(16,30,52,.6);--line:rgba(160,200,255,.14);--line-2:rgba(160,200,255,.08);
  --accent:#6fb1ff;--accent-soft:rgba(111,177,255,.14);--live:#ff4d6d;--gold:#f5c451;--good:#3ddc84;--bad:#ff7b8f;--shadow:0 12px 34px -18px rgba(0,0,0,.8)}
*{box-sizing:border-box}
/* One look (2026-10-18): Inter body text and 14px card corners, shared with College, NFL and NBA */
body{margin:0;color:var(--ink);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-optical-sizing:auto;background:var(--ice1)}
a{color:inherit}
/* ---- the rink ---- */
.rink{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,var(--ice1),var(--ice2) 70%,var(--ice3))}
.rink::before{content:"";position:absolute;inset:0;opacity:.5;background:
  repeating-linear-gradient(17deg,transparent 0 22px,rgba(255,255,255,.18) 22px 23px,transparent 23px 61px),
  repeating-linear-gradient(-23deg,transparent 0 37px,rgba(255,255,255,.12) 37px 38px,transparent 38px 90px),
  radial-gradient(60% 40% at 30% 20%,rgba(255,255,255,.55),transparent 70%)}
:root.dark .rink::before{opacity:.35;background:
  repeating-linear-gradient(17deg,transparent 0 22px,rgba(140,190,255,.06) 22px 23px,transparent 23px 61px),
  repeating-linear-gradient(-23deg,transparent 0 37px,rgba(140,190,255,.05) 37px 38px,transparent 38px 90px),
  radial-gradient(55% 35% at 50% 0%,rgba(120,170,255,.16),transparent 70%)}
.rink svg{position:absolute;inset:3vh 2vw;width:96vw;height:94vh;opacity:var(--line-o)}
.rink .portrait{display:none}
@media (max-aspect-ratio:1/1){.rink .landscape{display:none}.rink .portrait{display:block}}
:root.dark .rink svg{filter:drop-shadow(0 0 6px rgba(80,150,255,.35))}
.rink .r{stroke:var(--red);fill:none}.rink .rf{fill:var(--red)}.rink .b{stroke:var(--blue);fill:none}.rink .bf{fill:var(--blue)}.rink .board{stroke:var(--ink-3);fill:none}.rink .crease{fill:var(--crease);opacity:.55}
/* ---- layout ---- */
.app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:16px 16px 70px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .puck{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3f47,#0b0d10 70%);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 -3px 0 rgba(255,255,255,.08)}
.brand h1{margin:0;font-family:var(--disp);font-size:24px;letter-spacing:-.02em;line-height:1}
.brand h1 b{background:linear-gradient(90deg,#1d5fc4,#00b4d8);-webkit-background-clip:text;background-clip:text;color:transparent}
:root.dark .brand h1 b{background:linear-gradient(90deg,#6fb1ff,#7ee8fa);-webkit-background-clip:text;background-clip:text}
.brand .season{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 6px;padding:2px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);backdrop-filter:blur(8px)}
.nav a.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root.dark .nav a.on{color:#08111f}
.upd{font-size:12.5px;color:var(--ink-3);margin:6px 2px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2)}
.card .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 16px 0}
.card .hd h3{margin:0;font-size:16.5px}
.card .bd{padding:12px 16px 16px}
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 2px 12px}
.sec h2{margin:0;font-family:var(--disp);font-size:20px;letter-spacing:-.02em}
.sec .note{color:var(--ink-3);font-size:13px}
.mini{font-size:12.5px;color:var(--ink-3)}
.dim{color:var(--ink-3)}
.grid{display:grid;gap:12px}.grid>*{min-width:0}.card{min-width:0;max-width:100%}.g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.logo{width:28px;height:28px;object-fit:contain;flex:none}
.logo.lg{width:58px;height:58px}.logo.xl{width:92px;height:92px}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.pill.live{background:var(--live);color:#fff}.pill.nat{background:rgba(17,40,75,.08);color:var(--ink-2)}:root.dark .pill.nat{background:rgba(160,200,255,.12)}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--tc,#0b5cad),var(--tc2,#081a33));box-shadow:0 18px 40px -22px rgba(0,0,0,.6)}
.hero .wm{position:absolute;right:-24px;top:-24px;width:200px;opacity:.12}
.hero .eb{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero h2{margin:4px 0 2px;font-family:var(--disp);font-size:28px;letter-spacing:-.02em}
.hero .meta{opacity:.9}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.hero .chip{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.hero .nx{margin-top:14px;padding:14px;border-radius:14px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.14);text-decoration:none;display:block;color:#fff}
.hero .nx .k{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero .nx .g{margin-top:6px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero .cd{margin-top:4px;font-family:var(--disp);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.hero .cd i{font-style:normal;opacity:.5}.hero .cd .u{font-size:15px;opacity:.7;margin:0 6px 0 1px}
/* date strip */
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0 4px;padding:2px}
.days::-webkit-scrollbar{display:none}
.days a{flex:none;text-decoration:none;text-align:center;min-width:64px;padding:7px 8px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);backdrop-filter:blur(8px)}
.days a b{display:block;font-size:13.5px}.days a span{display:block;font-size:11px;color:var(--ink-3)}
.days a.on{background:var(--accent);border-color:var(--accent);color:#fff}.days a.on span{color:rgba(255,255,255,.8)}
:root.dark .days a.on{color:#08111f}:root.dark .days a.on span{color:rgba(8,17,31,.7)}

.gc{display:block;text-decoration:none;padding:12px 14px}

.tbl tr.fav td{background:var(--accent-soft)}

.tbl .tn{display:flex;align-items:center;gap:8px;font-weight:700}.tbl .tn .logo{width:22px;height:22px}

.seg a.on{background:var(--accent);color:#fff;border-color:var(--accent)}:root.dark .seg a.on{color:#08111f}

.gh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:18px}
.gh .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;text-decoration:none}
.gh .side .n{font-weight:800;font-size:16px}.gh .side .r{font-size:12.5px;color:var(--ink-3)}
.gh .mid{text-align:center}.gh .mid .sc{font-family:var(--disp);font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.gh .mid .w{font-size:13px;font-weight:700;color:var(--ink-3);margin-top:6px}
.goal{display:grid;grid-template-columns:52px 28px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2);font-size:14px}
.goal:first-child{border-top:0}.goal .tg{font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.goal .as{font-size:12.5px;color:var(--ink-3)}
.bar{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.bar .k{grid-column:1/-1;text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:-2px}
.bar .v{font-weight:800;font-variant-numeric:tabular-nums}.bar .v.r{text-align:right}
.bar .tr{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--line-2)}.bar .tr i{display:block;height:100%}
/* tv guide */
.tvslot{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.tvslot:first-child{border-top:0}.tvslot .tm{font-family:var(--disp);font-weight:800;font-size:15px}
.tvg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0;text-decoration:none}
.tvg .mt{display:flex;align-items:center;gap:6px;font-weight:700;min-width:0}.tvg .mt .logo{width:22px;height:22px}
/* teams */
.tcard{display:flex;align-items:center;gap:10px;padding:10px 12px;text-decoration:none;border-radius:12px;border:1px solid var(--line);background:var(--card-2)}
.tcard .n{font-weight:700}.tcard .r{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.empty{padding:16px;color:var(--ink-3)}
.foot{margin-top:30px;font-size:12px;color:var(--ink-3)}
select{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
@media (max-width:560px){.hero h2{font-size:23px}.hero .cd{font-size:27px}.gh .mid .sc{font-size:34px}.logo.xl{width:64px;height:64px}.tvslot{grid-template-columns:70px 1fr}.g2{grid-template-columns:1fr}}
</style>

  const row = g => { const home = g.home === ab, opp = home ? g.away : g.home; const res = done(g) ? (() => { const m = home ? g.hs : g.as, o = home ? g.as : g.hs; return '<b style="color:' + (m > o ? 'var(--good)' : 'var(--bad)') + '">' + (m > o ? 'W' : (g.end ? 'OTL' : 'L')) + ' ' + m + '-' + o + endTag(g) + '</b>'; })() : live(g) ? '<span class="pill live">' + esc(g.det || 'LIVE') + '</span>' : esc(timeStr(g)) + ' ' + tvBadges(g, 2); return '<a class="tvg" href="#/game/' + g.id + '" style="justify-content:space-between;border-top:1px solid var(--line-2);padding:8px 0"><span class="mt"><span class="dim" style="min-width:76px">' + esc(dayShort(g.date) + ' ' + md(g.date)) + '</span>' + (home ? 'vs ' : 'at ') + logo(opp) + esc(team(opp).nick) + (g.type === 1 ? ' <span class="pill nat">pre</span>' : '') + '</span><span>' + res + '</span></a>'; };
  view.innerHTML = heroHTML(ab) + '<div class="grid g2" style="margin-top:14px"><div class="card"><div class="hd"><h3>Coming up</h3><a class="mini" href="#/schedule/' + ab + '">Full schedule ›</a></div><div class="bd">' + (next.map(row).join('') || '<div class="mini">No games left on the schedule.</div>') + '</div></div><div class="card"><div class="hd"><h3>Recent results</h3></div><div class="bd">' + (past.map(row).join('') || '<div class="mini">No games played yet.</div>') + '</div></div></div>'
    + (ab !== SET.fav ? '<div style="margin-top:12px"><a class="nav-like" href="#" id="mkfav" style="font-weight:700;color:var(--accent)">Make the ' + esc(T[ab].nick) + ' my team ›</a></div>' : '');
  const mk = $('#mkfav'); if (mk) mk.onclick = e => { e.preventDefault(); SET.fav = ab; save('nhl-settings', SET); route(); }; }
function renderSchedule(ab){ setNav('teams'); ab = (ab || SET.fav).toUpperCase(); const gs = teamGames(ab).filter(g => g.type !== 1); const months = {};
  gs.forEach(g => { const k = g.date.slice(0, 7); (months[k] = months[k] || []).push(g); });
  view.innerHTML = '<div class="sec" style="margin-top:6px"><h2>' + esc(team(ab).full) + ' schedule</h2><span class="note">' + gs.length + ' games</span></div>' + Object.entries(months).map(([k, list]) => '<div class="card" style="margin-bottom:12px"><div class="hd"><h3>' + esc(new Intl.DateTimeFormat('en-US', {timeZone:'UTC', month:'long', year:'numeric'}).format(new Date(k + '-15T12:00:00Z'))) + '</h3><span class="mini">' + list.length + ' games</span></div><div class="bd">' + list.map(g => { const home = g.home === ab, opp = home ? g.away : g.home; const res = done(g) ? (() => { const m = home ? g.hs : g.as, o = home ? g.as : g.hs; return '<b style="color:' + (m > o ? 'var(--good)' : 'var(--bad)') + '">' + (m > o ? 'W' : (g.end ? 'OTL' : 'L')) + ' ' + m + '-' + o + endTag(g) + '</b>'; })() : esc(timeStr(g)) + ' ' + tvBadges(g, 2); return '<a class="tvg" href="#/game/' + g.id + '" style="justify-content:space-between;border-top:1px solid var(--line-2);padding:7px 0"><span class="mt"><span class="dim" style="min-width:76px">' + esc(dayShort(g.date) + ' ' + md(g.date)) + '</span>' + (home ? 'vs ' : 'at ') + logo(opp) + esc(team(opp).nick) + '</span><span>' + res + '</span></a>'; }).join('') + '</div></div>').join(''); }
function renderSettings(){ setNav('settings');
  view.innerHTML = '<div class="sec" style="margin-top:6px"><h2>Settings</h2></div><div class="card"><div class="bd grid" style="gap:14px"><label><div class="mini" style="margin-bottom:4px">Your team</div><select id="s-fav">' + Object.values(T).sort((a, b) => a.full.localeCompare(b.full)).map(t => '<option value="' + t.ab + '"' + (t.ab === SET.fav ? ' selected' : '') + '>' + esc(t.full) + '</option>').join('') + '</select></label>'
    + '<label><div class="mini" style="margin-bottom:4px">Theme</div><select id="s-theme">' + [['auto','Match my device'],['light','Light (fresh sheet of ice)'],['dark','Dark (night game)']].map(x => '<option value="' + x[0] + '"' + (theme() === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></label>'
    + '<label><div class="mini" style="margin-bottom:4px">Time zone</div><select id="s-tz">' + Object.keys(TZS).map(k => '<option' + (TZ() === k ? ' selected' : '') + '>' + k + '</option>').join('') + '</select></label><div class="mini">Theme and time zone are shared with the CFB, NFL and NBA sections.</div></div></div>';
  $('#s-fav').onchange = e => { SET.fav = e.target.value; save('nhl-settings', SET); };
  $('#s-theme').onchange = e => { SHARED.theme = e.target.value; save('jsh-shared', SHARED); applyTheme(); };
  $('#s-tz').onchange = e => { SHARED.tz = e.target.value; save('jsh-shared', SHARED); upd(); }; }

/* ---------- live polling: the shown date (and the hero team's game) while games are near ---------- */
let TIMER = null, POLLDATE = null;
async function poll(date){ POLLDATE = date || POLLDATE; clearTimeout(TIMER); const days = [POLLDATE, etDate()].filter((d, i, a) => d && a.indexOf(d) === i); let any = false, changed = false;
  for (const d of days) { const near = G.some(g => g.date === d && Math.abs(kickMs(g.date, g.time) - Date.now()) < 6 * 3600e3); if (!near) continue;
    try { const r = await fetch(API + '/nhl/score?date=' + d, {cache:'no-store'}); if (!r.ok) continue; const j = await r.json(); (j.games || []).forEach(e => { const k = String(e.id); const before = JSON.stringify(LIVE[k] || null); LIVE[k] = e; if (JSON.stringify(e) !== before) changed = true; if (e.st === 'IN_PROGRESS') any = true; }); } catch (e) {} }
  if (changed) { const y = scrollY; routeInner(true); window.scrollTo(0, y); }
  TIMER = setTimeout(() => poll(), any ? 30e3 : 300e3); }
function upd(){ $('#upd').textContent = 'Updated ' + asofTZ() + ' · times in ' + TZ(); }
/* the stamp is written in Eastern time; show it in the time zone the page uses (2026-10-21) */
function asofTZ(){ const m = String(ASOF || '').match(/^(.*?) · (\d{1,2}):(\d{2}) (AM|PM) ET$/); const sh = { ET: 0, CT: -1, MT: -2, PT: -3 }[TZ()]; if (!m || sh == null) return ASOF || ''; const h = (+m[2]) % 12 + (m[4] === 'PM' ? 12 : 0) + sh; if (h < 0) return ASOF; return m[1] + ' · ' + ((h % 12) || 12) + ':' + m[3] + ' ' + (h >= 12 ? 'PM' : 'AM') + ' ' + TZ(); }
function tick(){ document.querySelectorAll('[data-cd]').forEach(el => { const k = +el.dataset.cd; el.innerHTML = k - Date.now() <= 0 ? 'Puck drop!' : cdHTML(k); }); }
let QUIET = false;
function routeInner(quiet){ QUIET = !!quiet; const p = (location.hash || '#/').replace(/^#\/?/, '').split('/').map(decodeURIComponent); const r = p[0] || 'scores';
  if (!quiet) window.scrollTo(0, 0);
  if (r === 'scores') renderScores(p[1]); else if (r === 'game') renderGame(p[1]); else if (r === 'standings') renderStandings(p[1]); else if (r === 'tv') renderTV(p[1]); else if (r === 'teams') renderTeams(); else if (r === 'team') renderTeam(p[1]); else if (r === 'schedule') renderSchedule(p[1]); else if (r === 'settings') renderSettings(); else renderScores(); }
function route(){ routeInner(false); }
window.addEventListener('hashchange', route);
upd(); route(); setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
})();
</script>
