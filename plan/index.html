<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wedding Planning</title>
<!-- Lets the planner sit on a phone's Home Screen like an app, which is what an iPhone needs before it will
     show RSVP alerts. -->
<link rel="manifest" href="/plan/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wedding Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C2523">
<style>
  :root {
    --bg: #0C2523; --fg: #E9EEE9; --fg-2: #8AA697;
    --accent: #D2A94E; --line: rgba(138,166,151,.24);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: Inter, system-ui, sans-serif; }
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; color: var(--fg); padding: 24px;
  }
  #gate h1 { font-weight: 300; letter-spacing: .04em; margin: 0; font-size: 1.4rem; }
  #gate p { color: var(--fg-2); margin: 0; font-size: .9rem; }
  #gate form { display: flex; gap: 10px; }
  #gate input {
    background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--fg);
    padding: 10px 14px; border-radius: 8px; font-size: 1rem; letter-spacing: .2em;
    outline: none; width: 200px; text-align: center;
  }
  #gate input:focus { border-color: var(--accent); }
  #gate button {
    background: var(--accent); color: #0C2523; border: 0; border-radius: 8px;
    padding: 10px 18px; font-size: .95rem; cursor: pointer; font-weight: 500;
  }
  #gate .err { color: #E07CA3; font-size: .85rem; min-height: 1.2em; }
  #loading { color: var(--fg-2); }
</style>
</head>
<body>
<div id="gate">
  <h1>J &amp; D</h1>
  <p>This page is just for us.</p>
  <form id="passForm">
    <input id="passInput" type="password" autocomplete="current-password" placeholder="passcode" autofocus>
    <button type="submit">Enter</button>
  </form>
  <div class="err" id="gateErr"></div>
</div>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>window.react = window.React;</script>
<script crossorigin src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script>
(function () {
  const PASS_KEY = "wedding_pass";
  const gate = document.getElementById("gate");
  const err = document.getElementById("gateErr");

  async function verify(pass) {
    const res = await fetch("/api/wedding", { headers: { "x-wedding-pass": pass } });
    if (res.status === 401) return false;
    if (!res.ok) throw new Error("Server not ready (" + res.status + ")");
    return true;
  }

  function installStorage(pass) {
    window.storage = {
      async get(key) {
        const res = await fetch("/api/wedding", { headers: { "x-wedding-pass": pass } });
        if (!res.ok) throw new Error("load failed");
        return await res.json(); // { value: string | null }
      },
      async set(key, value) {
        const res = await fetch("/api/wedding", {
          method: "PUT",
          headers: { "x-wedding-pass": pass },
          body: value,
        });
        if (!res.ok) throw new Error("save failed");
        return true;
      },
    };

    // Live website RSVPs and the phone-alert switch, for the planner's RSVP panel.
    window.weddingApi = {
      async rsvps() {
        const res = await fetch("/api/rsvp", { headers: { "x-wedding-pass": pass } });
        if (!res.ok) throw new Error("rsvps failed");
        return await res.json();
      },
      async setParty(id, partySize) {
        const res = await fetch("/api/rsvp", {
          method: "PUT",
          headers: { "x-wedding-pass": pass, "content-type": "application/json" },
          body: JSON.stringify({ id, partySize }),
        });
        if (!res.ok) throw new Error("save failed");
        return await res.json();
      },
      push: makePush(pass),
    };
  }

  // RSVP alerts on this device. The site pushes straight to the phone's own notification system, so there is no app
  // to install; an iPhone only allows it once the planner has been added to the Home Screen.
  function makePush(pass) {
    const ua = navigator.userAgent || "";
    const isIOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    const label = /ipad/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? "iPad"
      : /iphone|ipod/i.test(ua) ? "iPhone"
      : /android/i.test(ua) ? "Android phone"
      : /windows/i.test(ua) ? "Windows computer"
      : /mac os x|macintosh/i.test(ua) ? "Mac"
      : "A device";

    const call = async (method, body) => {
      const res = await fetch("/api/rsvp-alerts", {
        method,
        headers: { "x-wedding-pass": pass, "content-type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok && !data.results) throw new Error(data.message || "That didn't go through. Try again in a minute.");
      return data;
    };
    const keyBytes = (b64) => {
      const s = b64.replace(/-/g, "+").replace(/_/g, "/");
      const bin = atob(s + "=".repeat((4 - (s.length % 4)) % 4));
      return Uint8Array.from(bin, (c) => c.charCodeAt(0));
    };
    // the same short fingerprint the server keeps for each device (it never sends the subscription address back)
    const tagOf = async (endpoint) => {
      const hash = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(new URL(endpoint).toString())));
      return btoa(String.fromCharCode(...hash)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "").slice(0, 16);
    };
    const registration = () => navigator.serviceWorker.register("/plan/sw.js", { scope: "/plan/", updateViaCache: "none" });
    const mySub = async () => {
      if (!supported) return null;
      const reg = await navigator.serviceWorker.getRegistration("/plan/");
      return reg ? await reg.pushManager.getSubscription() : null;
    };

    // What the planner's alert box needs to draw itself.
    const status = async () => {
      const server = await call("GET");
      const sub = await mySub().catch(() => null);
      const tag = sub ? await tagOf(sub.endpoint) : null;
      return {
        supported,
        needsInstall: !supported && isIOS && !standalone,   // an iPhone in a Safari tab
        blocked: supported && Notification.permission === "denied",
        tag,
        onHere: Boolean(tag && server.devices.some((d) => d.tag === tag)),
        devices: server.devices,
        label,
      };
    };

    return {
      status,
      async enable() {
        if (!supported) throw new Error("This browser can't show notifications.");
        const permission = await Notification.requestPermission();
        if (permission !== "granted") throw new Error("Notifications weren't allowed, so alerts stay off on this device.");
        const { publicKey } = await call("GET");
        const reg = await registration();
        await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (sub) {
          // a subscription made for an older site key can't be used; start clean
          const had = sub.options && sub.options.applicationServerKey ? new Uint8Array(sub.options.applicationServerKey) : null;
          const want = keyBytes(publicKey);
          if (!had || had.length !== want.length || had.some((b, i) => b !== want[i])) { await sub.unsubscribe(); sub = null; }
        }
        if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(publicKey) });
        await call("POST", { action: "subscribe", sub: sub.toJSON(), label });
        return await status();
      },
      async disable() {
        const sub = await mySub();
        if (sub) {
          await call("POST", { action: "unsubscribe", tag: await tagOf(sub.endpoint) });
          await sub.unsubscribe().catch(() => {});
        }
        return await status();
      },
      // { ok, results: [{ label, ok, status, why }] }
      async test(onlyThisDevice) {
        const sub = onlyThisDevice ? await mySub() : null;
        return await call("POST", { action: "test", tag: sub ? await tagOf(sub.endpoint) : "" });
      },
    };
  }

  async function boot(pass) {
    installStorage(pass);
    localStorage.setItem(PASS_KEY, pass);
    gate.innerHTML = '<p id="loading">Loading the plan…</p>';
    const src = await (await fetch("dashboard.jsx")).text();
    const { code } = Babel.transform(src, { presets: ["react"] });
    gate.remove();
    new Function(code)();
  }

  document.getElementById("passForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pass = document.getElementById("passInput").value.trim();
    if (!pass) return;
    err.textContent = "";
    try {
      if (await verify(pass)) await boot(pass);
      else err.textContent = "That's not it — try again.";
    } catch (ex) {
      err.textContent = ex.message;
    }
  });

  const saved = localStorage.getItem(PASS_KEY);
  if (saved) {
    verify(saved).then((ok) => { if (ok) boot(saved); }).catch(() => {});
  }
})();
</script>
</body>
</html>
