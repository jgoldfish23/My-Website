<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jamo Sports Hub</title>
<meta name="description" content="College football, the NFL and the NBA in one place: your teams, live scores and what is on TV.">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-title" content="Jamo Sports">
<link rel="icon" type="image/svg+xml" href="/sports/icons/jsh.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/sports/icons/jsh-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/sports/icons/jsh-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/sports/icons/jsh-180.png">
<link rel="manifest" href="/sports/icons/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Inter+Tight:wght@500..800&family=Orbitron:wght@600;800&display=swap">
<style>
/* ===== Jamo Sports Hub home (2026-10-04 redesign): your teams first, then what is live, what is on TV today, and each sport ===== */
:root{
  --bg:#05070d; --surface:rgba(255,255,255,.035); --surface-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.05);
  --ink:#eef2f8; --ink-2:#a9b3c4; --ink-3:#6f7a8c; --live:#ff4d6a; --gold:#fbbf24;
  --cfb:#3b7bff; --nfl:#ff3b5c; --nba:#a45bff;
  --plate:#fff; --sh:0 18px 40px -22px rgba(0,0,0,.85); --r:20px;
  --disp:"Inter Tight","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --num:"Orbitron","Inter Tight",system-ui,sans-serif;
  color-scheme:dark;
}
:root.light{--bg:#eef1f6;--surface:#fff;--surface-2:#f4f6fa;--line:#dde2ea;--line-2:#e9edf3;--ink:#0d1220;--ink-2:#465166;--ink-3:#7b8598;--live:#e0193a;--sh:0 1px 2px rgba(15,23,42,.05),0 14px 30px -18px rgba(15,23,42,.25);--cfb:#1d5fd8;--nfl:#d0103a;--nba:#7c3aed;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 8% -6%,rgba(79,140,255,.16),transparent 60%),radial-gradient(800px 560px at 96% -8%,rgba(160,91,255,.14),transparent 62%),radial-gradient(700px 420px at 50% 112%,rgba(251,191,36,.07),transparent 60%)}
:root.light body::before{background:radial-gradient(900px 520px at 8% -6%,rgba(79,140,255,.12),transparent 60%),radial-gradient(800px 560px at 96% -8%,rgba(160,91,255,.10),transparent 62%)}
a{color:inherit;text-decoration:none}
img{max-width:100%}
[hidden]{display:none!important}
.fd{max-width:1240px;margin:0 auto;padding:18px 16px 44px}
/* ---------- hero ---------- */
.hero{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:stretch;padding:28px 28px 26px;border-radius:26px;color:#fff;background:#070a14;background-image:radial-gradient(780px 380px at 0% 0%,rgba(79,140,255,.42),transparent 62%),radial-gradient(640px 380px at 100% 0%,rgba(160,91,255,.38),transparent 64%),radial-gradient(560px 300px at 60% 130%,rgba(251,191,36,.16),transparent 62%);border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 70px -40px rgba(0,0,0,.9);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(120% 90% at 30% 0%,#000 30%,transparent 75%);mask-image:radial-gradient(120% 90% at 30% 0%,#000 30%,transparent 75%)}
.hero::after{content:"";position:absolute;left:-150px;bottom:-250px;width:400px;height:400px;border-radius:50%;border:16px solid rgba(251,191,36,.16);border-bottom-color:transparent;transform:rotate(18deg);z-index:-1}
.hi-l{display:flex;flex-direction:column;justify-content:center;min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#a9bde2}
.hero h1{margin:8px 0 6px;font-family:var(--disp);font-size:clamp(30px,4.6vw,48px);font-weight:800;letter-spacing:-.035em;line-height:1.02}
.hero h1 b{background:linear-gradient(90deg,#9cc6ff,#cdb2ff 55%,#fcd56b);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{margin:0;color:#c6d0e3;font-size:15.5px;max-width:560px}
.pulse{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);font-size:12.5px;font-weight:600;color:#e6ecf7;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,#fff);flex:none}
.chip.live i{background:#ff4d6a;animation:ping 1.6s infinite}
a.chip:hover{background:rgba(255,255,255,.12)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,77,106,.65)}70%{box-shadow:0 0 0 8px rgba(255,77,106,0)}100%{box-shadow:0 0 0 0 rgba(255,77,106,0)}}
/* next up: a countdown to the next game for one of your teams */
.nu{position:relative;display:flex;flex-direction:column;justify-content:center;gap:10px;height:100%;padding:18px 20px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.13);min-width:0;color:#fff}
a.nu:hover{border-color:rgba(255,255,255,.28)}
.nu-l{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fcd56b}
.nu-l span:last-child{color:#a9bde2;letter-spacing:.06em}
.nu-m{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:20px;font-weight:800;letter-spacing:-.02em;min-width:0}
.nu-m .at{font-family:var(--body);font-size:12px;font-weight:600;color:#a9bde2;letter-spacing:.04em}
.nu-m .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd{display:flex;align-items:baseline;gap:2px;font-family:var(--num);font-weight:800;font-size:34px;line-height:1;letter-spacing:.02em;color:#eaf6ff;text-shadow:0 0 18px rgba(120,180,255,.45);font-variant-numeric:tabular-nums}
.cd i{font-style:normal;opacity:.45;margin:0 1px}
.cd .u{font-family:var(--body);font-size:12px;font-weight:700;color:#a9bde2;margin:0 6px 0 2px;text-shadow:none;letter-spacing:.04em}
.nu-s{font-size:13px;color:#c6d0e3}
.nu.live .cd{color:#fff;text-shadow:0 0 18px rgba(255,77,106,.5)}
.sm-plate{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--plate);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.sm-plate img{width:26px;height:26px;object-fit:contain;display:block}
.sm-plate .sw{width:18px;height:18px;border-radius:5px}
/* ---------- sections ---------- */
.sec{display:flex;align-items:baseline;gap:10px;margin:30px 2px 12px}
.sec h2{margin:0;font-family:var(--disp);font-size:21px;font-weight:800;letter-spacing:-.025em}
.sec .note{color:var(--ink-3);font-size:13px}
.sec .more{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
a.more:hover{color:var(--ink)}
/* ---------- your teams ---------- */
.teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tc{position:relative;display:flex;flex-direction:column;gap:12px;min-height:236px;padding:16px 16px 14px;border-radius:var(--r);color:#fff;background:linear-gradient(150deg,var(--tc) 0%,var(--tc2) 78%);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.14);overflow:hidden;isolation:isolate;transition:transform .2s,box-shadow .2s}
.tc::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.18),transparent 55%),linear-gradient(180deg,transparent 40%,rgba(0,0,0,.28))}
.tc .wm{position:absolute;right:-26px;bottom:-30px;width:150px;height:150px;object-fit:contain;opacity:.13;z-index:-1;filter:grayscale(1) brightness(3);pointer-events:none}
a.tc:hover{transform:translateY(-3px);box-shadow:0 26px 50px -24px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.18)}
.tc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tc-sport{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:999px;background:rgba(0,0,0,.24);font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.tc-sport svg{width:13px;height:13px}
.tc-rank{font-family:var(--num);font-size:13px;font-weight:800;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.18)}
.tc-id{display:flex;align-items:center;gap:12px;min-width:0}
.plate{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--plate);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.plate img{width:44px;height:44px;object-fit:contain;display:block}
.plate .sw{width:28px;height:28px;border-radius:8px}
.tc-name{font-family:var(--disp);font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-meta{margin-top:3px;font-size:12.5px;color:rgba(255,255,255,.82);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-meta b{color:#fff;font-weight:700}
.tc-next{margin-top:auto;padding:11px 12px;border-radius:14px;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.12)}
.tc-k{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.tc-g{margin-top:4px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-g .dim{font-weight:500;color:rgba(255,255,255,.72)}
.tc-cd{display:flex;align-items:baseline;margin-top:6px;font-family:var(--num);font-size:19px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 14px rgba(255,255,255,.25)}
.tc-cd i{font-style:normal;opacity:.5;margin:0 1px}
.tc-cd .u{font-family:var(--body);font-size:10.5px;font-weight:700;opacity:.75;margin:0 6px 0 1px;letter-spacing:.04em}
.tc-sc{display:flex;align-items:baseline;gap:8px;margin-top:4px;font-family:var(--num);font-size:24px;font-weight:800}
.tc-sc .dim{font-family:var(--body);font-size:12.5px;font-weight:600;color:rgba(255,255,255,.75)}
.tc-last{font-size:12.5px;color:rgba(255,255,255,.82)}
.tc-last b{font-weight:800}
.tc-last .w{color:#9df5c1}.tc-last .l{color:#ffb3bf}
.tc.pick{align-items:center;justify-content:center;text-align:center;background:var(--surface);border:1.5px dashed var(--line);color:var(--ink);box-shadow:none}
.tc.pick::before{display:none}
.tc.pick b{color:var(--nfl)}
.tc.pick .tc-sport{background:var(--surface-2);color:var(--ink-2)}
.tc.pick .big{font-family:var(--disp);font-size:20px;font-weight:800;letter-spacing:-.02em;margin:12px 0 4px}
.tc.pick .small{font-size:13px;color:var(--ink-2);max-width:220px;margin:0 auto}
.pill-live{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:5px;background:var(--live);color:#fff;font-size:10px;font-weight:800;letter-spacing:.1em}
.pill-live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
/* ---------- live now ---------- */
.lrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,300px);gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.lc{display:block;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);scroll-snap-align:start;border-top:3px solid var(--c);transition:transform .15s}
.lc:hover{transform:translateY(-2px)}
.lc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.lc-h span:last-child{color:var(--live);letter-spacing:.04em}
.tl{display:flex;align-items:center;gap:9px;padding:3px 0;font-weight:700;font-size:15px;color:var(--ink-2)}
.tl.w{color:var(--ink)}
.tl img,.tl .sw{width:22px;height:22px;object-fit:contain;flex:none;border-radius:5px}
.tl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .rk{font-size:11px;color:var(--ink-3);margin-right:3px}
.tl .sc{font-family:var(--num);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
/* ---------- on TV today: one timeline across the three sports ---------- */
.tv{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.tv-slot{display:grid;grid-template-columns:96px 1fr;border-top:1px solid var(--line-2)}
.tv-slot:first-child{border-top:0}
.tv-t{padding:14px 0 14px 18px;font-family:var(--num);font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}
.tv-t small{display:block;margin-top:3px;font-family:var(--body);font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-3)}
.tv-gs{display:flex;flex-direction:column;border-left:1px solid var(--line-2);min-width:0}
.tv-g{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line-2);transition:background .15s}
.tv-g:first-child{border-top:0}
a.tv-g:hover{background:var(--surface-2)}
.sp-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.sp-tag svg{width:12px;height:12px}
.tv-m{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;font-size:14.5px}
.tv-m img,.tv-m .sw{width:22px;height:22px;object-fit:contain;flex:none;border-radius:5px}
.tv-m .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-m .at{font-weight:500;color:var(--ink-3);font-size:12.5px}
.tv-m .rk{font-size:11px;color:var(--ink-3);margin-right:2px}
.tv-m .fav{color:var(--gold)}
.net{padding:4px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:11.5px;font-weight:800;letter-spacing:.03em;color:var(--ink-2);white-space:nowrap}
.tv-st{min-width:86px;text-align:right;font-size:12.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.tv-st b{font-family:var(--num);font-size:14px;color:var(--ink)}
.tv-st.live{color:var(--live)}
.tv-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2);font-size:13px;color:var(--ink-3)}
.tv-foot a{font-weight:700;color:var(--ink);padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.tv-foot a:hover{border-color:var(--ink-3)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:14px;color:var(--ink-3);font-size:14px;text-align:center}
/* ---------- each sport ---------- */
.sports{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.sp{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;min-width:0}
.sp-h{position:relative;display:flex;align-items:center;gap:12px;padding:16px 16px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,transparent),transparent)}
.sp-ic{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--c);color:#fff;box-shadow:0 8px 18px -8px var(--c)}
.sp-ic svg{width:21px;height:21px}
.sp-n{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.02em}
.sp-x{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-go{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
a.sp-h:hover .sp-go{color:var(--c)}
.ql{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.ql::-webkit-scrollbar{display:none}
.ql a{flex:none;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line)}
.ql a:hover{color:var(--ink);border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.sp-b{padding:2px 12px 12px}
.sp-lab{margin:6px 4px 6px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.gm{display:block;padding:9px 6px;border-top:1px solid var(--line-2);border-radius:10px}
.gm:first-of-type{border-top:0}
a.gm:hover{background:var(--surface-2)}
.gm .tl{font-size:14px;padding:2px 0}
.gm .tl img,.gm .tl .sw{width:20px;height:20px}
.gm .tl .sc{font-size:15px}
.gm-st{margin-top:3px;font-size:12px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;margin-top:30px;padding:0 2px;color:var(--ink-3);font-size:12.5px}
.foot i{font-style:normal;color:var(--ink-2)}
/* entrance, on the first draw only (the 30-second live redraws skip it) */
.anim .rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ---------- widths ---------- */
@media (max-width:1100px){.teams{grid-template-columns:repeat(2,minmax(0,1fr))}.sports{grid-template-columns:1fr 1fr}.sp.nba{grid-column:1/-1}}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding:22px 18px 18px;border-radius:22px}.hero::after{display:none}}
@media (max-width:720px){
  .fd{padding:12px 12px 36px}
  .sec{margin-top:26px}.sec h2{font-size:19px}
  .teams{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:84%;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -12px;padding:2px 12px 10px;scroll-padding-left:12px;scrollbar-width:none}
  .teams::-webkit-scrollbar{display:none}
  .tc{scroll-snap-align:start;min-height:220px}
  .sports{grid-template-columns:1fr}.sp.nba{grid-column:auto}
  .tv-slot{grid-template-columns:1fr}.tv-t{padding:12px 16px 2px}.tv-t small{display:inline;margin-left:6px}.tv-gs{border-left:0}
  .tv-g{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"m st" "tag net";row-gap:6px;padding:10px 16px}
  .tv-g .sp-tag{grid-area:tag;justify-self:start}.tv-g .tv-m{grid-area:m}.tv-g .net{grid-area:net;justify-self:end}.tv-g .tv-st{grid-area:st;min-width:0}
  .lrow{grid-auto-columns:82%}
  .cd{font-size:29px}
}
@media (prefers-reduced-motion:reduce){.anim .rise,.chip.live i,.pill-live::before{animation:none}a.tc:hover,.lc:hover{transform:none}}
</style>
</head>
<body>
<!-- Jamo Sports Hub top bar: added by each hub's deploy_public.sh right after <body> (never inside the claude.ai artifact) -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&display=swap">

  const when = s => { const m = /^[A-Z][a-z]{2} ([A-Z][a-z]{2} \d+), \d{4} · (.*)$/.exec(s || ''); return m ? (m[1] === md(TODAY) ? '' : m[1] + ', ') + m[2] : (s || '?'); };
  $('#asof').textContent = 'Updated: College ' + when(META.cfb) + ' · NFL ' + when(META.nfl) + ' · NBA ' + when(META.nba);
  $('#upd').textContent = LAST ? 'live scores ' + fmt({hour:'numeric', minute:'2-digit'}, new Date(LAST)) : ''; }
function tick(){ document.querySelectorAll('[data-cd]').forEach(el => { const k = +el.dataset.cd; el.innerHTML = k - Date.now() <= 0 ? 'Starting now' : cdHTML(k); }); }
const API = /(^|\.)djgolding\.com$/.test(location.hostname) ? '/api' : 'https://djgolding.com/api';
const slim = e => ({st:e.st, det:e.det, per:e.per, clk:e.clk, as:e.away && e.away.s, hs:e.home && e.home.s});
async function getJ(u){ try { const r = await fetch(u, {cache:'no-store'}); return r.ok ? await r.json() : null; } catch (e) { return null; } }
const near = (list, hrs) => list.some(g => !played(g) && Math.abs(kickMs(g.date, g.time) - Date.now()) < hrs * 3600e3);
async function poll(){ const jobs = [];
  if (near(CFB.filter(g => g.week === CFB_WEEK), 5)) for (const grp of ['80', '81']) jobs.push(getJ(API + '/cfb/scoreboard?week=' + CFB_WEEK + '&groups=' + grp).then(j => { (j && j.games || []).forEach(e => { LIVE.cfb[e.date + '|' + e.away.n + '|' + e.home.n] = slim(e); }); }));
  if (near(NFL.filter(g => g.week === nflWeek.week && g.stype === nflWeek.stype), 5)) jobs.push(getJ(API + '/nfl/scoreboard?week=' + nflWeek.week + '&stype=' + nflWeek.stype).then(j => { (j && j.games || []).forEach(e => { LIVE.nfl[e.id] = slim(e); }); }));
  for (const d of [TODAY, addDay(TODAY, -1)]) if (near(NBA.filter(g => g.date === d), 4)) jobs.push(getJ(API + '/nba/scoreboard?date=' + d.replace(/-/g, '')).then(j => { (j && j.games || []).forEach(e => { LIVE.nba[e.id] = slim(e); }); }));
  if (jobs.length) { await Promise.all(jobs); LAST = Date.now(); $('#fd').classList.remove('anim'); render(); }
  const anyLive = Object.values(LIVE).some(m => Object.values(m).some(x => isLiveSt(x.st)));
  clearTimeout(TIMER); TIMER = setTimeout(poll, anyLive ? 30e3 : (jobs.length ? 120e3 : 600e3)); }
render(); setInterval(tick, 1000); setTimeout(poll, 900);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
})();
</script>
